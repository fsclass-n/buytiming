# EC2(또는 로컬)용 전체 스택: nginx(프런트엔드 + /api 프록시) + FastAPI + RPA 스케줄러. DB는 TiDB(Render·로컬과 공유)
#
#   실행:            docker compose up -d --build
#   시드(최초 1회):  docker compose exec api python -m app.seed
#
# 값은 저장소 루트의 .env 파일에서 읽는다(.env.example 참고). 같은 .env를 로컬 PC와 Render(환경 변수 붙여 넣기)에도 쓴다.
services:
  api:
    build: ./backend
    image: buytiming-api:latest
    env_file: .env
    environment:
      PORT: "8000"
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  rpa:
    build: ./rpa
    image: buytiming-rpa:latest
    env_file: .env
    environment:
      # 기본: 같은 EC2의 api 컨테이너(.env에 RPA_TARGET_API를 넣지 않음)
      RPA_TARGET_API: ${RPA_TARGET_API:-http://api:8000}
    volumes:
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/config.same-origin.js:/etc/nginx/app-config.js:ro
    depends_on:
      - api
    restart: unless-stopped
