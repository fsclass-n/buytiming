# Netlify: 저장소 루트에 두고 frontend/ 폴더를 정적 사이트로 배포한다.
# 사이트 환경 변수 API_BASE_URL(예: https://picktiming-api.onrender.com)을 지정하면 실제 API와 연동된다.
[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci && npm run build"
  # frontend/가 바뀐 커밋만 빌드 (백엔드만 바뀌면 건너뜀)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
