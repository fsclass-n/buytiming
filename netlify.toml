# Netlify: 저장소 루트에 두고 frontend/ 폴더를 정적 사이트로 배포한다.
# 사이트 환경 변수 API_BASE_URL(예: https://buytiming-api.onrender.com)을 지정하면 실제 API와 연동된다.
[build]
  base = "frontend"
  publish = "."
  command = "sh build.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
