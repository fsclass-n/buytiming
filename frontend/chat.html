<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 상담 · 바이타이밍</title>
  <meta name="description" content="실시간 가격 비교와 AI 구매 적기 판단 서비스">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-nav"></div>
<main class="container py-4" id="app">
  <div class="row g-4">
    <div class="col-lg-4"><div class="card p-3" id="chat-summary"></div></div>
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-2"><h1 class="h5 fw-bold mb-0"><i class="bi bi-stars text-brand me-1"></i>AI 구매 상담</h1>
        <span class="small text-secondary" id="remaining"></span></div>
      <div class="d-flex flex-wrap gap-2 mb-2" id="suggests"></div>
      <div class="chat-box mb-2" id="chat-box"></div>
      <form id="chat-form" class="d-flex gap-2"><input class="form-control" id="question" maxlength="200" placeholder="예: 다음 주까지 기다리면 더 싸질까?" aria-label="질문" required>
        <button class="btn btn-brand px-4" id="send-btn" aria-label="보내기"><i class="bi bi-send"></i></button></form>
      <p class="small text-secondary mt-2">AI는 수집된 가격 데이터와 분석 수치만 근거로 답합니다. 참고 정보로 활용해 주세요.</p>
    </div>
  </div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/chat.js"></script>
</body>
</html>
