<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 바이타이밍</title>
  <meta name="description" content="실시간 가격 비교와 AI 구매 적기 판단 서비스">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-nav"></div>
<main class="container py-4" id="app">
  <div class="auth-wrap mx-auto">
    <div class="card p-4">
      <h1 class="h4 fw-bold mb-3 text-center"><i class="bi bi-clock-history text-brand me-1"></i>로그인</h1>
      <div id="demo-hint"></div>
      <form id="login-form" novalidate>
        <div class="mb-3"><label class="form-label" for="email">이메일</label><input class="form-control" id="email" type="email" required autocomplete="username"></div>
        <div class="mb-3"><label class="form-label" for="password">비밀번호</label><input class="form-control" id="password" type="password" required autocomplete="current-password"></div>
        <div id="login-error"></div>
        <button class="btn btn-brand w-100" type="submit">로그인</button>
      </form>
      <p class="text-center small mt-3 mb-0">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </div>
  </div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
