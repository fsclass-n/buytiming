<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 상세 · 바이타이밍</title>
  <meta name="description" content="실시간 가격 비교와 AI 구매 적기 판단 서비스">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-nav"></div>
<main class="container py-4" id="app">
  <div id="product-head"></div>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card p-3 mb-4"><div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 fw-bold mb-0">쇼핑몰별 실시간 가격 비교</h2><span class="small text-secondary" id="collected-at"></span></div>
        <div id="compare"></div></div>
      <div class="card p-3"><div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 fw-bold mb-0">가격 추이</h2>
        <div class="btn-group btn-group-sm" role="group" id="range-group">
          <button class="btn btn-outline-secondary" data-days="7">7일</button><button class="btn btn-outline-secondary" data-days="30">30일</button><button class="btn btn-outline-secondary active" data-days="90">90일</button>
        </div></div>
        <div id="chart" class="plot"></div></div>
    </div>
    <div class="col-lg-5">
      <div class="card p-3 mb-4" id="timing"></div>
      <div class="card p-3 advice-card" id="advice"></div>
    </div>
  </div>
  <div class="modal fade" id="watch-modal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form id="watch-form"><div class="modal-header"><h5 class="modal-title">관심 상품 등록</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button></div>
    <div class="modal-body"><label class="form-label" for="target">목표가(원, 선택)</label><input class="form-control" id="target" type="number" min="0" step="10">
    <div class="form-text">실구매가가 목표가 이하가 되면 알림을 보내 드립니다.</div></div>
    <div class="modal-footer"><button class="btn btn-brand">등록</button></div></form></div></div></div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script type="module" src="js/pages/product.js"></script>
</body>
</html>
