<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 검색·등록 · 바이타이밍</title>
  <meta name="description" content="실시간 가격 비교와 AI 구매 적기 판단 서비스">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-nav"></div>
<main class="container py-4" id="app">
  <h1 class="h4 fw-bold mb-3">상품 검색·등록</h1>
  <form id="search-form" class="d-flex gap-2 mb-4"><input class="form-control" id="q" placeholder="상품명·브랜드·카테고리" aria-label="검색어">
    <button class="btn btn-brand px-4"><i class="bi bi-search me-1"></i>검색</button></form>
  <div class="row g-3" id="results"></div>
  <h2 class="section-title h5">상품 URL로 등록</h2>
  <div class="card p-3">
    <form id="url-form" class="row g-2 align-items-end">
      <div class="col-md-6"><label class="form-label small" for="url">상품 페이지 URL</label><input class="form-control" id="url" type="url" placeholder="https://..." required></div>
      <div class="col-md-4"><label class="form-label small" for="pname">상품명(선택)</label><input class="form-control" id="pname" maxlength="100"></div>
      <div class="col-md-2"><button class="btn btn-outline-primary w-100">등록</button></div>
    </form>
    <p class="small text-secondary mt-2 mb-0"><i class="bi bi-shield-check me-1"></i>약관·robots.txt로 수집이 허용된 공개 상품 페이지만 수집합니다.</p>
  </div>
</main>
<div id="app-footer"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/search.js"></script>
</body>
</html>
