# Render Blueprint: 단독 풀스택(FastAPI + 프런트엔드 정적 파일, Docker). DB는 TiDB Cloud(MySQL 호환)를 DATABASE_URL로 연결한다.
# 프런트엔드와 API가 같은 도메인(https://buytiming.onrender.com)이며, 가격 수집은 GitHub Actions(collect-render.yml)가 매시 실행한다.
# 배포는 GitHub Actions(deploy.yml)가 테스트 통과 후 Deploy Hook으로 트리거한다(autoDeployTrigger: off).
services:
  - type: web
    name: buytiming
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL          # 예: mysql+pymysql://USER:PASSWORD@HOST:4000/buytiming?charset=utf8mb4
        sync: false
      - key: DB_SSL_CA             # TiDB Cloud TLS
        value: /etc/ssl/certs/ca-certificates.crt
      - key: JWT_SECRET
        generateValue: true
      - key: RPA_API_KEY           # GitHub Secret RENDER_RPA_API_KEY와 같은 값
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: ALLOWED_ORIGINS       # 같은 도메인이라 CORS가 필요 없으므로 자기 주소만 허용
        value: https://buytiming.onrender.com
      - key: ADMIN_EMAILS
        sync: false
