# Render Blueprint: 단독 풀스택(FastAPI + 프런트엔드 정적 파일, Docker). DB는 TiDB Cloud(MySQL 호환)를 DATABASE_URL로 연결한다.
# 프런트엔드와 API가 같은 도메인(https://buytiming.onrender.com)이며, 가격 수집은 GitHub Actions(collect-render.yml)가 매시 실행한다.
# 배포: main에 커밋하면 GitHub Actions의 CI가 모두 통과한 뒤 Render가 자동 배포한다(After CI Checks Pass).
#       아래 경로가 바뀐 커밋만 배포하며, 이 경우 Deploy Hook(RENDER_DEPLOY_HOOK_URL)은 등록하지 않는다(중복 배포 방지).
# 환경 변수 값은 로컬·EC2와 같은 .env를 대시보드 Environment → "Add from .env"로 붙여 넣는다.
services:
  - type: web
    name: buytiming
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - render.yaml
        - .dockerignore
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL          # 예: mysql+pymysql://USER:PASSWORD@HOST:4000/buytiming?charset=utf8mb4
        sync: false
      - key: DB_SSL_CA             # TiDB Cloud TLS
        value: /etc/ssl/certs/ca-certificates.crt
      - key: JWT_SECRET            # 로컬·EC2와 같은 .env 값
        sync: false
      - key: RPA_API_KEY           # GitHub Secret RENDER_RPA_API_KEY와 같은 값
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: ALLOWED_ORIGINS       # .env와 같은 값(세 환경 주소)
        value: https://buytiming.onrender.com,http://buytiming.duckdns.org,http://localhost:8000
      - key: ADMIN_EMAILS
        sync: false
