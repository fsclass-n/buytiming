name: CI

on:
  push:
    # main은 deploy.yml이 이 워크플로를 호출하므로 중복 실행하지 않는다
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · pytest on SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend

  backend-mysql:
    name: Backend (pytest on MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: buytiming_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+pymysql://ci:ci-password@127.0.0.1:3306/buytiming_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend

  rpa:
    name: RPA (lint · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: rpa/requirements*.txt
      - run: pip install -r rpa/requirements-dev.txt
      - run: ruff check rpa
      - run: pytest -q
        working-directory: rpa

  frontend:
    name: Frontend (JS syntax · Netlify build script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS 모듈 문법 검사
        run: |
          for f in frontend/js/*.js frontend/js/pages/*.js; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "syntax error: $f"; exit 1; }
          done
      - name: build.sh로 config.js 생성 확인
        working-directory: frontend
        env:
          API_BASE_URL: https://example.onrender.com
        run: sh build.sh && grep -q "https://example.onrender.com" js/config.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, rpa]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t buytiming-api:ci backend
      - run: docker build -t buytiming-rpa:ci rpa
      - name: API 컨테이너 헬스 체크
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////app/data/ci.db buytiming-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Render 풀스택 이미지 빌드·확인 (API + 프런트엔드 같은 도메인)
        run: |
          docker build -f backend/Dockerfile.render -t buytiming-render:ci .
          docker run -d --name render -p 8001:10000 -e PORT=10000 -e DATABASE_URL=sqlite:////app/data/ci.db buytiming-render:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && break; sleep 2; done
          curl -fsS http://localhost:8001/ | grep -q "js/config.js" \
            && curl -fsS http://localhost:8001/js/config.js | grep -q 'API_BASE_URL: "/"' \
            || { docker logs render; exit 1; }
      - name: Compose 설정 검증 (.env.example을 그대로 복사해도 동작해야 함)
        run: cp .env.example .env && docker compose config -q
