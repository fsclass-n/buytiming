name: Collect (Render)

# Render 무료 플랜은 상주 작업(RPA 스케줄러)을 돌릴 수 없으므로 GitHub Actions가 RPA 수집기를 매시 실행해 Render API로 보낸다.
# EC2는 자체 rpa 컨테이너가 수집한다. 두 수집기가 같은 TiDB에 보내도 API가 같은 시간대 중복을 건너뛴다.
#
#   매시 07분(정각 혼잡 회피): collect
#   KST 03시 + train / 06시 + public / 월요일 07시 + report(엑셀은 Actions 아티팩트로 30일 보관)
#
# 필요한 값(없으면 건너뜀): Variable RENDER_URL(예: https://buytiming.onrender.com), Secret RENDER_RPA_API_KEY(Render의 RPA_API_KEY)
# 선택: Variable KCA_API_URL, Secret DATA_GO_KR_KEY (참가격 공공데이터)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: 실행할 작업
        type: choice
        options: [collect, train, public, report]
        default: collect

permissions:
  contents: read

concurrency:
  group: collect-render
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  plan:
    name: 실행할 작업 결정
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - id: plan
        env:
          URL: ${{ vars.RENDER_URL }}
          KEY: ${{ secrets.RENDER_RPA_API_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "RENDER_URL variable 또는 RENDER_RPA_API_KEY secret이 없어 건너뜁니다."
            echo "jobs=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            jobs="$INPUT_JOB"
          else
            h=$(date +%H); d=$(date +%u); jobs="collect"
            [ "$h" = "03" ] && jobs="$jobs train"
            [ "$h" = "06" ] && jobs="$jobs public"
            [ "$d" = "1" ] && [ "$h" = "07" ] && jobs="$jobs report"
          fi
          echo "실행할 작업(KST $(date '+%F %H:%M')): $jobs"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  run:
    name: 수집기 실행 → Render API
    needs: plan
    if: needs.plan.outputs.jobs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RPA_TARGET_API: ${{ vars.RENDER_URL }}
      RPA_API_KEY: ${{ secrets.RENDER_RPA_API_KEY }}
      KCA_API_URL: ${{ vars.KCA_API_URL }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      JOBS: ${{ needs.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: rpa/requirements.txt
      - run: pip install -r rpa/requirements.txt
      - name: Render 깨우기 (무료 플랜은 15분간 요청이 없으면 잠듦)
        run: |
          for i in $(seq 1 18); do curl -fsS -m 20 "${RPA_TARGET_API%/}/health" && exit 0; sleep 10; done
          echo "Render 헬스 체크 실패"; exit 1
      - name: 작업 실행
        working-directory: rpa
        run: for j in $JOBS; do echo "::group::$j"; python -m collector.jobs "$j"; echo "::endgroup::"; done
      - name: 주간 리포트 보관
        if: contains(env.JOBS, 'report')
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: rpa/reports/*.xlsx
          retention-days: 30
