name: Deploy

# main 브랜치에 push되면 CI 전체를 통과한 뒤 Render(API) · AWS EC2(전체 스택/RPA) · Netlify(프런트엔드)에 배포한다.
# 필요한 값을 등록하지 않은 대상은 건너뛴다.
#   Secrets:   RENDER_DEPLOY_HOOK_URL, EC2_HOST, EC2_USER, EC2_SSH_KEY, NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#   Variables: RENDER_HEALTH_URL(예: https://buytiming-api.onrender.com/health), EC2_APP_DIR(기본 ~/buytiming),
#              API_BASE_URL(Netlify 프런트엔드가 호출할 API 주소)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  render:
    name: Render (FastAPI)
    needs: ci
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      HEALTH: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Deploy Hook 호출
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Render 배포를 요청했습니다."
      - name: 헬스 체크 대기
        if: env.HOOK != '' && env.HEALTH != ''
        run: |
          sleep 60
          for i in $(seq 1 30); do curl -fsS "$HEALTH" && exit 0; sleep 10; done
          echo "Render 헬스 체크 실패"; exit 1
      - name: 건너뜀 안내
        if: env.HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK_URL secret이 없어 Render 배포를 건너뜁니다."

  ec2:
    name: AWS EC2 (docker compose)
    needs: ci
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.EC2_HOST }}
      USER: ${{ secrets.EC2_USER }}
      KEY: ${{ secrets.EC2_SSH_KEY }}
      APP_DIR: ${{ vars.EC2_APP_DIR || '~/buytiming' }}
    steps:
      - name: SSH 키 준비
        if: env.HOST != ''
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ec2.pem && chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: 원격 배포 (git pull → docker compose up)
        if: env.HOST != ''
        run: |
          ssh -i ~/.ssh/ec2.pem "$USER@$HOST" "set -e; cd $APP_DIR; git pull --ff-only origin main; \
            docker compose up -d --build --remove-orphans; docker image prune -f; \
            for i in \$(seq 1 30); do curl -fsS http://localhost/health && exit 0; sleep 3; done; docker compose logs --tail 50 api; exit 1"
      - name: 건너뜀 안내
        if: env.HOST == ''
        run: echo "EC2_HOST secret이 없어 EC2 배포를 건너뜁니다."

  netlify:
    name: Netlify (frontend)
    needs: ci
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE: ${{ secrets.NETLIFY_SITE_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: config.js 생성 후 zip 배포 (Netlify API)
        if: env.TOKEN != '' && env.SITE != ''
        working-directory: frontend
        run: |
          sh build.sh
          zip -qr /tmp/site.zip . -x build.sh
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary @/tmp/site.zip "https://api.netlify.com/api/v1/sites/$SITE/deploys" > /dev/null
          echo "Netlify 배포 완료"
      - name: 건너뜀 안내
        if: env.TOKEN == '' || env.SITE == ''
        run: echo "Netlify Git 연동(netlify.toml)으로 배포하거나 NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID secret을 등록하세요."
